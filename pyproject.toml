[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "height-estimation"
version = "0.1.0"
description = "Simple computer vision tools for metric height estimation"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26,<3",
    "opencv-contrib-python>=4.10,<5",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
height-estimation = "height_estimation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
